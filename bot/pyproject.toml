[project]
name = "infrascan-ai-bot"
version = "0.1.0"
description = "InfraScan AI Telegram bot powered by aiogram 3.x"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.20.0",
    "aiogram[redis]>=3.20.0",
    "aiohttp>=3.11.18",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "google-genai>=1.0.0",
    "redis>=5.0.0",
    "fpdf2>=2.8.0",
]

[project.scripts]
bot = "src.bot:main"

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8", "pytest-asyncio>=0.25", "mypy>=1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
