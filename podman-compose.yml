name: infrascan-ai

services:
  db:
    image: docker.io/library/postgres:17
    container_name: infrascan-ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=16MB
        -c synchronous_commit=off
        -c checkpoint_completion_target=0.9
    networks:
      - odoo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: docker.io/library/odoo:19
    container_name: infrascan-ai_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      - web_data:/var/lib/odoo
      - ./config:/etc/odoo:ro
      - ./addons:/mnt/extra-addons:ro
    command: odoo --config /etc/odoo/odoo.conf
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo_db_password
    networks:
      - odoo-internal
      - npm_network
      - bot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: infrascan-ai_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - bot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./bot
      dockerfile: Containerfile
    image: infrascan-ai-bot:latest
    container_name: infrascan-ai_bot
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./bot/.env
    networks:
      - bot-net
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c 'import src.config' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
    name: infrascan-ai_db_data
    external: true
  web_data:
    name: infrascan-ai_web_data
    external: true
  redis_data:
    name: infrascan-ai_redis_data

networks:
  odoo-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  bot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  npm_network:
    external: true
