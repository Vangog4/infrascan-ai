# Agent Collaboration Registry — infrascan-ai
# Четыре движка: Claude (оркестратор) + Gemini (специалист) + Kimi (аналитик) + Grok (realtime/независимое мнение)
# Router: hooks/router.py  |  Scripts: hooks/gemini_agent.sh, /root/kimi_agent.sh, hooks/grok_agent.sh

version: "2.1"

# ── Агенты ────────────────────────────────────────────────────────────────────

agents:
  claude:
    role: orchestrator
    description: >
      Главный оркестратор. Пишет и редактирует код, управляет git,
      принимает архитектурные решения. Делегирует Gemini и Kimi
      когда их специализация даёт явное преимущество.
    strengths:
      - точное редактирование кода (Edit/Write/Bash)
      - архитектурное мышление и планирование
      - git workflow и коммиты
      - управление FSM, тестами, хуками
    token_limit: 200_000
    cost_tier: medium
    always_handles:
      - редактирование файлов (Edit/Write)
      - коммиты и git операции
      - быстрые правки (typo, config, rename)
      - финальные решения после анализа субагентов

  gemini:
    role: specialist
    description: >
      Специалист. 2M токен контекст + живой веб-доступ + Vision API.
      Запускается лениво только при реальной необходимости.
    binary: gemini
    model: gemini-3.1-pro-preview
    model_fast: gemini-3.1-flash-lite
    script: /root/agents/gemini_agent.sh
    strengths:
      - Vision API (тепловые снимки, фото объектов, скриншоты)
      - живой веб-поиск и актуальные доки (Google grounding)
      - adversarial security review (Red Team)
      - code review git diff (независимый взгляд)
      - ретроспектива сессий
      - диагностика стека (health)
    token_limit: 2_000_000
    cost_tier: low
    modes:
      review:        "git diff → code review"
      analyze:       "файл/директория → глубокий анализ (2M ctx)"
      research:      "веб-поиск + актуальные доки"
      health:        "диагностика контейнеров и VDS"
      redteam:       "adversarial security audit"
      retrospective: "ночная ретроспектива сессии"
    projects:
      infrascan-ai:
        - анализ тепловых снимков и промптов Gemini Vision
        - security audit webhook/bot endpoints
        - code review перед релизом
        - поиск в Odoo 19 docs
      astrotara:
        - исследование астро-алгоритмов онлайн
        - ревью новых фич перед релизом
      all:
        - health check всех сервисов
        - ретроспективы сессий

  kimi:
    role: analyst
    description: >
      Аналитик-помощник. Kimi-k2.6, 262K токен контекст, thinking mode,
      встроенный веб-поиск (moonshot_search). Полноценный coding agent —
      читает файлы через свои инструменты автономно.
      Скрипт на уровне сервера: /root/kimi_agent.sh
    binary: kimi
    model: kimi-for-coding (Kimi-k2.6)
    script: /root/kimi_agent.sh
    api: https://api.kimi.com/coding/v1 (OAuth, managed)
    strengths:
      - 262K контекст — весь bot/src/ за один вызов
      - thinking mode — глубокое рассуждение перед ответом
      - встроенный веб-поиск (moonshot_search)
      - автономное чтение файлов через нативные инструменты
      - анализ больших логов и дампов данных
      - черновые исследования и брейнштормы
      - анализ схем БД и предложение миграций
      - второе мнение по архитектурным решениям
      - сравнение подходов A/B с обоснованием
    token_limit: 262_144
    cost_tier: low
    modes:
      analyze:  "путь → анализ кода (Kimi читает файлы сам)"
      bulk:     "файл → анализ логов/дампов"
      draft:    "черновик/брейншторм (быстро)"
      migrate:  "путь → схема БД → миграции"
      compare:  "вопрос → сравнение подходов A/B"
      council:  "вопрос → второе мнение по архитектуре"
      review:   "git diff → code review"
      research: "вопрос → веб-поиск (встроенный)"
    projects:
      infrascan-ai:
        - полный анализ bot/src/ + addons/ за один вызов
        - анализ логов контейнеров за период
        - анализ SQLAlchemy / Odoo моделей
        - черновики новых фич перед реализацией
      astrotara:
        - весь codebase → поиск скрытых багов
        - анализ схемы astro.db (недостающие колонки)
        - черновики для новых астро-фич
      dogsensei:
        - анализ monitoring логов
        - черновики новых проверок
      all:
        - анализ логов при инцидентах
        - сравнение архитектурных вариантов
        - второе мнение перед крупными решениями

  grok:
    role: contrarian
    description: >
      Четвёртый движок (xAI Grok). CLI нет — ходим в OpenAI-совместимый
      API api.x.ai через grok_client.py. Ниша: актуальные realtime-данные
      (X/web) + независимое второе мнение с другой модельной школы,
      чем Gemini/Kimi (полезно против группового мышления).
    binary: grok  # официальный Grok Build CLI v0.2.45 (/root/.local/bin/grok)
    model: grok-build  # дефолт подписки; переопределить env GROK_MODEL (см. `grok models`)
    script: /root/agents/grok_agent.sh
    auth: OAuth через подписку SuperGrok / X Premium+ (БЕЗ API-ключа)
    login: "grok login --device-auth"  # device-code для headless-сервера (код+URL на телефон)
    run_mode: "grok --permission-mode plan --prompt-file ... (read-only, агент не правит файлы)"
    api_fallback: /root/agents/grok_client.py → api.x.ai (если есть XAI_API_KEY; не основной путь)
    strengths:
      - realtime-доступ к X / свежим веб-данным
      - независимое рассуждение (другая модель → ломает confirmation bias)
      - адвокат дьявола / контраргументы по архитектуре
      - code review и redteam «вторым взглядом»
    cost_tier: medium
    modes:
      review:   "git diff → code review"
      analyze:  "файл/директория → анализ"
      research: "актуальный поиск (realtime X/web)"
      redteam:  "adversarial security audit diff"
      council:  "независимое второе мнение / рассуждение"
      draft:    "быстрый черновик/брейншторм"
      swarm:    "МУЛЬТИ-АГЕНТ: оркестратор спавнит 8 параллельных read-only субагентов (по измерению аудита) → единый отчёт. Тюнинг GROK_SUBAGENTS / GROK_MAX_TURNS"
      models:   "список доступных моделей xAI (проверка ключа)"
    multiagent:
      native_subagents: "включены по умолчанию (spawn_subagent); --no-subagents выключает"
      best_of_n: "--best-of-n N — N параллельных прогонов задачи → выбор лучшего (headless)"
      custom_agents: "--agents <JSON> / --agent <path.md> (frontmatter: name/description/permission_mode)"
      bundled: "~/.grok/bundled/agents (explore) + skills (review/implement/design/execute-plan)"
    projects:
      all:
        - второе мнение «с другой школы» перед крупными решениями
        - актуальные данные из X/web в реальном времени
        - контраргументы к плану (адвокат дьявола)
    status: "CLI установлен (v0.2.45), интеграция готова; ждёт `grok login --device-auth` (подписка SuperGrok)"

# ── Маршрутизация ─────────────────────────────────────────────────────────────

routing:
  priority_order: [claude_override, size_threshold, gemini_keywords, kimi_keywords, grok_keywords, claude_default]

  claude_override:
    description: "Всегда Claude — мгновенные простые правки"
    triggers: [быстрое исправление, quick fix, typo, rename, config, git commit]

  size_thresholds:
    file_gt_50kb:  {engine: kimi,   mode: analyze, reason: "огромный файл → Kimi 262K"}
    file_gt_8kb:   {engine: gemini, mode: analyze, reason: "большой файл → Gemini 2M"}

  gemini_keywords:
    priority: 10-5
    routes:
      - {priority: 10, keywords: [фото, image, thermal, vision, термограмм], mode: analyze}
      - {priority:  9, keywords: [research, погугли, odoo docs, changelog],   mode: research}
      - {priority:  8, keywords: [уязвимост, red team, exploit, xss, rce],    mode: redteam}
      - {priority:  7, keywords: [code review, ревью диф, перед коммитом],    mode: review}
      - {priority:  6, keywords: [health check, состояние системы, диагностик], mode: health}
      - {priority:  5, keywords: [ретроспектив, retrospective],               mode: retrospective}

  kimi_keywords:
    priority: 9-4
    routes:
      - {priority: 9, keywords: [весь репо, all files, весь код, полный репозиторий], mode: analyze}
      - {priority: 8, keywords: [лог, logs, traceback, bot.log, ошибки за],          mode: bulk}
      - {priority: 7, keywords: [миграци, alter table, sqlalchemy, схема бд],        mode: migrate}
      - {priority: 6, keywords: [актуальн, поищи, найди инфо],                      mode: research}
      - {priority: 5, keywords: [сравни, compare, trade-off, что лучше],             mode: compare}
      - {priority: 5, keywords: [второе мнение, council, посоветуй],                 mode: council}
      - {priority: 4, keywords: [черновик, draft, набросок, а что если],             mode: draft}

  grok_keywords:
    priority: 9-5
    routes:
      - {priority: 9, keywords: [grok, грок, x.com, twitter, твиттер, что в тренде, реалтайм, real-time], mode: research}
      - {priority: 5, keywords: [независимое мнение, контраргумент, оспорь, адвоката дьявола, сыграй скептика], mode: council}

# ── Хуки безопасности ────────────────────────────────────────────────────────

safety:
  hooks:
    PreToolUse:
      - {matcher: Bash,        script: hooks/safety_guard.py,  action: block_on_exit_2}
      - {matcher: "Write|Edit", script: hooks/skill_vetter.py, action: block_on_exit_2}
    PostToolUse:
      - {matcher: "Edit|Write",      script: hooks/run_pytest.sh,     action: block_on_exit_2}
      - {matcher: "Bash|Edit|Write", script: hooks/stuck_detector.py, action: block_on_exit_2}
    Stop:
      - {script: hooks/auto_journal.py,  description: "Logseq журнал сессии"}
      - {script: hooks/retrospective.py, description: "Gemini ретроспектива если есть diff"}

  sandboxing:
    runtime: podman
    confirmation_gateway: hooks/confirm_bridge.py

# ── Quick Reference ───────────────────────────────────────────────────────────

quick_reference:
  gemini: |
    bash hooks/gemini_agent.sh review
    bash hooks/gemini_agent.sh analyze bot/src/
    bash hooks/gemini_agent.sh research "вопрос"
    bash hooks/gemini_agent.sh health
    bash hooks/gemini_agent.sh redteam
    bash hooks/gemini_agent.sh retrospective
  kimi: |
    kimi_agent analyze /root/infrascan/backend/bot/src/
    kimi_agent bulk /root/infrascan/backend/bot.log
    kimi_agent draft "идея для новой фичи"
    kimi_agent migrate /root/astrotara_bot/bot_app/src/database/models.py
    kimi_agent compare "Redis pub/sub vs Kafka"
    kimi_agent council "стоит ли переходить на webhook mode"
    kimi_agent research "aiogram 3.x FSM best practices 2025"
  grok: |
    grok login --device-auth                                # вход по подписке SuperGrok (headless)
    bash hooks/grok_agent.sh models                         # проверка логина + список моделей
    bash hooks/grok_agent.sh research "что в тренде в X про aiogram"
    bash hooks/grok_agent.sh council "оспорь переход на webhook mode"
    bash hooks/grok_agent.sh review                         # code review diff вторым взглядом
    bash hooks/grok_agent.sh redteam
    GROK_SUBAGENTS=8 bash hooks/grok_agent.sh swarm bot/src  # 8 параллельных субагентов → аудит
  router: |
    python3 hooks/router.py "описание задачи"
    echo '{"task":"...","files":["path"]}' | python3 hooks/router.py
