[options]
; ── Security ──────────────────────────────────────────────────────────────────
admin_passwd = CHANGE_ME_BEFORE_DEPLOY

; ── Database ──────────────────────────────────────────────────────────────────
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_db_password
db_maxconn = 64

; ── Paths ─────────────────────────────────────────────────────────────────────
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; ── Workers (website builder requires prefork workers ≥2) ────────────────────
workers = 2
max_cron_threads = 1

; ── Request / timeout limits ─────────────────────────────────────────────────
; Generous limits so asset compilation and page-builder saves never time out.
limit_time_cpu = 7200
limit_time_real = 14400
limit_request = 65536

; ── Memory limits ────────────────────────────────────────────────────────────
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; ── Reverse-proxy / longpolling ──────────────────────────────────────────────
proxy_mode = True
gevent_port = 8072
http_interface = 0.0.0.0

; ── Logging ──────────────────────────────────────────────────────────────────
log_level = info
log_handler = :INFO
